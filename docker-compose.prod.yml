# Reference production manifest.
#
# Deployment is owned by internal infra (Semaphore). This file documents the
# expected shape of the runtime: pull a published image by tag or digest and
# supply the full environment from an env file.
#
#   cp .env.docker.example .env    # fill in real values
#   IMAGE_TAG=<sha|semver> docker compose -f docker-compose.prod.yml up -d
#
# The image contains no configuration; everything below is runtime-injected.

services:
  j2it_web:
    image: ghcr.io/xtreemmak/j2it.us:${IMAGE_TAG:-latest}
    container_name: j2it_web
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      # Fixed container-internal values; everything else comes from .env
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - j2it_network

networks:
  j2it_network:
    driver: bridge
